name: Replay-oracle headroom

# Per-workload replay-oracle figures (phase3-results §6 follow-up): for each
# workload, one online tbjit run (default picker, JSON dump) plus a full
# TBJIT_TRACE_ONLY capture replayed through `tbjit_replay --oracle`. The TSV
# pairs the online JIT-served fraction with the rigorous never-deopt upper
# bound, within one run. This is the tighter headroom bound the paper cites
# in place of the summary-derived oracle_picker.py numbers.
#
# LD_PRELOAD is a no-op on macOS, so CI is the only venue. Manual dispatch
# only: the capture half records every allocation to disk and the numbers
# feed the paper, not per-push gating.

on:
  workflow_dispatch:

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # git_log workload walks history; needs full depth.
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential util-linux \
            lua5.4 jq xz-utils openssl perl g++

      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Run oracle suite
        run: |
          mkdir -p bench-out
          bash bench/realworkload/oracle_suite.sh build bench-out/oracle \
            | tee bench-out/oracle-run.log

      - name: Render results into job summary
        if: always()
        run: |
          {
            echo "## Replay-oracle headroom (online vs upper bound)"
            echo
            if [ -s bench-out/oracle/oracle_results.tsv ]; then
              echo '| workload | online jit % | online allocs | oracle % | oracle captured | oracle total |'
              echo '|---|--:|--:|--:|--:|--:|'
              tail -n +2 bench-out/oracle/oracle_results.tsv \
                | awk -F'\t' '{printf "| %s | %s | %s | %s | %s | %s |\n",$1,$2,$3,$4,$5,$6}'
            else
              echo "_no results TSV produced_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-${{ github.sha }}
          # Traces are deleted by the suite (large, regenerable); this is the
          # TSV + JSON dumps + per-workload logs + run log.
          path: |
            bench-out/oracle/
            bench-out/oracle-run.log
          retention-days: 90
