name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y cmake build-essential

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_FLAGS=-DTBJIT_DEBUG_JIT

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Bench
        if: success()
        run: |
          echo "::group::Benchmark suite (each pattern × each strategy)"
          bash bench/run_bench.sh build || true
          echo "::endgroup::"
          echo "::group::int_jit_verified dump"
          LD_PRELOAD=$PWD/build/libtbjit.so TBJIT_DUMP=1 \
            $PWD/build/test/integration/int_hello 2>&1 || true
          echo "::endgroup::"
