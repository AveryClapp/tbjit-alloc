name: Crash backtrace

# Dispatch-only diagnostic: reproduce the node_bench (SIGSEGV after
# "pthread_create: Invalid argument") crash under gdb on Linux and capture a
# backtrace. LD_PRELOAD is a no-op on macOS, so CI is the only repro venue.
# gdb itself is launched WITHOUT LD_PRELOAD; only the inferior gets libtbjit
# via `set exec-wrapper env`, so the debugger is not itself interposed.
on:
  workflow_dispatch:

jobs:
  backtrace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential gdb nodejs

      - name: Configure (RelWithDebInfo, matches production crash + symbols)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Versions
        run: |
          node --version
          gdb --version | head -1

      - name: Write node fixture
        run: |
          cat > /tmp/work.js <<'JS'
          let sink = 0;
          for (let round = 0; round < 300; round++) {
            const a = [];
            for (let i = 0; i < 50000; i++) {
              a.push({ k: "key_" + (i % 1024), v: i, tags: [i, i + 1, i + 2] });
            }
            for (const o of a) sink += o.v + o.tags.length;
          }
          process.stdout.write(String(sink) + "\n");
          JS

      - name: Bisection — no compilation (STABLE_WINDOWS huge -> pure passthrough)
        if: always()
        run: |
          PRE="$PWD/build/libtbjit.so"
          set +e
          LD_PRELOAD="$PRE" TBJIT_DUMP=1 TBJIT_STABLE_WINDOWS=100000000 \
            node /tmp/work.js >/dev/null 2>nocompile.err
          echo "no-compile exit=$?" | tee -a bisect.log
          echo "--- stderr tail ---" | tee -a bisect.log
          tail -5 nocompile.err | tee -a bisect.log

      - name: Bisection — force each strategy uniformly
        if: always()
        run: |
          PRE="$PWD/build/libtbjit.so"
          set +e
          for strat in bump freelist arena; do
            LD_PRELOAD="$PRE" TBJIT_DUMP=1 TBJIT_FORCE_STRATEGY=$strat \
              node /tmp/work.js >/dev/null 2>"force_$strat.err"
            echo "force=$strat exit=$?" | tee -a bisect.log
            grep -i "pthread_create\|Segmentation\|via JIT" "force_$strat.err" | tee -a bisect.log
            echo "---" | tee -a bisect.log
          done

      - name: Shadow validator — managed-only, report violated invariant
        if: always()
        run: |
          SHADOW="$PWD/build/libtbjit_shadow.so"
          set +e
          for mode in bump default; do
            if [ "$mode" = default ]; then ENV=""; else ENV="TBJIT_FORCE_STRATEGY=$mode"; fi
            env LD_PRELOAD="$SHADOW" $ENV node /tmp/work.js >/dev/null 2>"shadow_$mode.err"
            echo "shadow mode=$mode exit=$?" | tee -a bisect.log
            grep "tbjit shadow:" "shadow_$mode.err" | head | tee -a bisect.log
            echo "--- tail ---" | tee -a bisect.log
            tail -5 "shadow_$mode.err" | tee -a bisect.log
            echo "===" | tee -a bisect.log
          done

      - name: TLS-offset invariance probe (root-cause confirmation)
        if: always()
        run: |
          # Read the REAL tl_bumps thread_local from libtbjit on the main thread
          # and on a pthread-created worker, and print the offset the JIT bakes:
          #   off = &tl_bumps[idx].ptr - __builtin_thread_pointer()
          # If the two threads disagree, the baked fs:[off] is only valid on the
          # compiling thread -> cross-thread aliasing. That is the hypothesis.
          cat > /tmp/tlsprobe.cpp <<'CPP'
          #include <cstdint>
          #include <cstdio>
          #include <pthread.h>
          namespace tbjit { struct CallSiteID; namespace seg { struct SegmentHeader; } }
          // Mirror the real layout from src/codegen/tls.h exactly.
          namespace tbjit::codegen {
            struct BumpSlot { unsigned char* ptr; unsigned char* end; };
            constexpr unsigned MAX_COMPILED_SITES = 4096;
            extern thread_local BumpSlot tl_bumps[MAX_COMPILED_SITES];
          }
          using tbjit::codegen::tl_bumps;
          static long off(unsigned idx) {
            return (long)((intptr_t)&tl_bumps[idx].ptr
                          - (intptr_t)__builtin_thread_pointer());
          }
          static void* worker(void*) {
            printf("worker  idx0 off=%ld  idx7 off=%ld  &tl=%p tp=%p\n",
                   off(0), off(7), (void*)&tl_bumps[0], (void*)__builtin_thread_pointer());
            return nullptr;
          }
          int main() {
            printf("main    idx0 off=%ld  idx7 off=%ld  &tl=%p tp=%p\n",
                   off(0), off(7), (void*)&tl_bumps[0], (void*)__builtin_thread_pointer());
            pthread_t t; pthread_create(&t, nullptr, worker, nullptr);
            pthread_join(t, nullptr);
            return 0;
          }
          CPP
          set +e
          # Link against libtbjit so we bind to the SAME thread_local definitions
          # the JIT routine's baked offset was derived from.
          g++ -std=c++17 -O0 -g /tmp/tlsprobe.cpp -o /tmp/tlsprobe \
            -L"$PWD/build" -ltbjit -Wl,-rpath,"$PWD/build" -lpthread 2>tlsprobe.build.log
          echo "build rc=$?" | tee -a tls_probe.log
          cat tlsprobe.build.log | tee -a tls_probe.log
          /tmp/tlsprobe 2>&1 | tee -a tls_probe.log

      - name: Minimal multithreaded repro under shadow (force fast compile)
        if: always()
        run: |
          SHADOW="$PWD/build/libtbjit_shadow.so"
          PRE="$PWD/build/libtbjit.so"
          # Single hot call site, monomorphic 64-byte allocs across N threads.
          # Compiles fast (low STABLE_WINDOWS). Two phases:
          #  (A) each thread allocs+frees its own chunks (same-thread recycle)
          #  (B) producer/consumer: threads free chunks allocated by others
          #      (cross-thread free -> mpsc path).
          cat > /tmp/mt.cpp <<'CPP'
          #include <pthread.h>
          #include <cstdlib>
          #include <cstring>
          #include <cstdio>
          #include <atomic>
          #include <vector>
          static const int NT = 4;
          static const long ITERS = 400000;
          // realloc-growth: alloc small, grow via realloc several times, verify the
          // copied prefix survives migration, then free. Mirrors V8/STL vector growth
          // that exercises the tbjit realloc copy-migrate path on managed chunks.
          static void* realloc_grow(void*) {
            for (long i = 0; i < ITERS; i++) {
              size_t n = 16;
              unsigned char* p = (unsigned char*)malloc(n);
              if (!p) abort();
              memset(p, 0x5A, n);
              for (int g = 0; g < 4; g++) {
                size_t n2 = n * 2;
                unsigned char* q = (unsigned char*)realloc(p, n2);
                if (!q) abort();
                // The first n bytes must still be 0x5A after migration.
                for (size_t k = 0; k < n; k++)
                  if (q[k] != 0x5A) { fprintf(stderr,"CORRUPT prefix i=%ld g=%d k=%zu got=%02x\n", i,g,k,q[k]); abort(); }
                memset(q + n, 0x5A, n2 - n);  // fill the grown tail
                p = q; n = n2;
              }
              free(p);
            }
            return nullptr;
          }
          // cross-thread free: each producer fills a disjoint slice of a shared
          // pointer array; after they join, a different thread frees everything
          // (free on a thread other than the allocator -> tbjit mpsc path).
          static const long PER = 300000;
          static void** slab[3];
          static int pidx[3] = {0,1,2};
          static void* producer(void* a) {
            int id = *(int*)a;
            for (long i=0;i<PER;i++){
              void* p = malloc(48); if(!p) abort(); memset(p,0xC3,48);
              slab[id][i] = p;
            }
            return nullptr;
          }
          static void* freer(void*) {
            for (int id=0; id<3; id++)
              for (long i=0;i<PER;i++) free(slab[id][i]);
            return nullptr;
          }
          int main() {
            pthread_t t[NT];
            for (int i=0;i<NT;i++) pthread_create(&t[i],nullptr,realloc_grow,nullptr);
            for (int i=0;i<NT;i++) pthread_join(t[i],nullptr);
            // cross-thread phase
            for(int i=0;i<3;i++) slab[i]=(void**)malloc(sizeof(void*)*PER);
            pthread_t pr[3];
            for(int i=0;i<3;i++) pthread_create(&pr[i],nullptr,producer,&pidx[i]);
            for(int i=0;i<3;i++) pthread_join(pr[i],nullptr);
            pthread_t fr; pthread_create(&fr,nullptr,freer,nullptr);
            pthread_join(fr,nullptr);
            printf("OK\n");
            return 0;
          }
          CPP
          g++ -std=c++17 -O2 /tmp/mt.cpp -o /tmp/mt -lpthread
          set +e
          echo "=== mt under shadow (force freelist, STABLE_WINDOWS=2) ===" | tee -a bisect.log
          LD_PRELOAD="$SHADOW" TBJIT_FORCE_STRATEGY=freelist TBJIT_STABLE_WINDOWS=2 \
            /tmp/mt >/dev/null 2>mt_shadow.err
          echo "mt shadow freelist exit=$?" | tee -a bisect.log
          grep "tbjit shadow:" mt_shadow.err | head | tee -a bisect.log
          tail -4 mt_shadow.err | tee -a bisect.log
          echo "---" | tee -a bisect.log
          echo "=== mt under production (force freelist) ===" | tee -a bisect.log
          LD_PRELOAD="$PRE" TBJIT_FORCE_STRATEGY=freelist TBJIT_STABLE_WINDOWS=2 \
            /tmp/mt >/dev/null 2>mt_prod.err
          echo "mt prod freelist exit=$?" | tee -a bisect.log
          tail -4 mt_prod.err | tee -a bisect.log
          echo "===" | tee -a bisect.log

      - name: Bisection — single-threaded V8 (no concurrent marking)
        if: always()
        run: |
          PRE="$PWD/build/libtbjit.so"
          set +e
          LD_PRELOAD="$PRE" TBJIT_DUMP=1 \
            node --no-concurrent-marking --no-concurrent-sweeping \
                 --no-concurrent-recompilation \
            /tmp/work.js >/dev/null 2>nocc.err
          echo "no-concurrent-marking exit=$?" | tee -a bisect.log
          grep -i "pthread_create\|Segmentation\|via JIT" nocc.err | tee -a bisect.log
          echo "---" | tee -a bisect.log
          LD_PRELOAD="$PRE" TBJIT_DUMP=1 \
            node --single-threaded /tmp/work.js >/dev/null 2>single.err
          echo "single-threaded exit=$?" | tee -a bisect.log
          grep -i "pthread_create\|Segmentation\|via JIT" single.err | tee -a bisect.log
          echo "===" | tee -a bisect.log

      - name: Baseline — default (expected SIGSEGV) under gdb
        if: always()
        run: |
          PRE="$PWD/build/libtbjit.so"
          gdb -batch \
            -ex "set exec-wrapper env LD_PRELOAD=$PRE TBJIT_DUMP=1" \
            -ex run \
            -ex "echo \n==== BACKTRACE (node) ====\n" \
            -ex "bt" \
            -ex "echo \n==== FAULTING FRAME INFO ====\n" \
            -ex "info symbol \$rip" \
            --args node /tmp/work.js 2>&1 | tee node_bt.log | tail -60

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-backtraces-${{ github.sha }}
          path: |
            node_bt.log
            bisect.log
            nocompile.err
            force_bump.err
            force_freelist.err
            force_arena.err
            shadow_bump.err
            shadow_default.err
            tls_probe.log
            mt_shadow.err
            mt_prod.err
          retention-days: 30
