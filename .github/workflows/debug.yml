name: Crash backtrace

# Dispatch-only diagnostic: reproduce the clang_compile (SIGABRT) and
# find_so (SIGSEGV) crashes under gdb on Linux and capture backtraces.
# LD_PRELOAD is a no-op on macOS, so CI is the only repro venue. gdb itself
# is launched WITHOUT LD_PRELOAD; only the inferior gets libtbjit via
# `set exec-wrapper env`, so the debugger is not itself interposed.
on:
  workflow_dispatch:

jobs:
  backtrace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential gdb clang

      - name: Configure (RelWithDebInfo, matches production crash + symbols)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Versions
        run: |
          clang++ --version | head -1
          find --version | head -1
          gdb --version | head -1

      - name: find_so under gdb (SIGSEGV)
        if: always()
        run: |
          PRE="$PWD/build/libtbjit.so"
          gdb -batch \
            -ex "set exec-wrapper env LD_PRELOAD=$PRE TBJIT_DUMP=1" \
            -ex run \
            -ex "echo \n==== BACKTRACE (find_so) ====\n" \
            -ex "bt" \
            -ex "echo \n==== ALL THREADS ====\n" \
            -ex "thread apply all bt" \
            --args /usr/bin/find /usr -type f -name '*.so' 2>&1 | tee find_bt.log | tail -120

      - name: clang_compile under gdb (SIGABRT)
        if: always()
        run: |
          PRE="$PWD/build/libtbjit.so"
          cat > /tmp/fixture.cpp <<'EOF'
          #include <vector>
          #include <string>
          #include <map>
          template <typename T> struct W { T v; W(T x):v(x){} T get(){return v;} };
          int main(){ std::map<std::string,std::vector<int>> m; for(int i=0;i<100;i++) m[std::to_string(i)].push_back(i); W<int> w(3); return w.get()-3; }
          EOF
          gdb -batch \
            -ex "set follow-fork-mode child" \
            -ex "set detach-on-fork off" \
            -ex "set exec-wrapper env LD_PRELOAD=$PRE TBJIT_DUMP=1" \
            -ex run \
            -ex "echo \n==== BACKTRACE (clang child) ====\n" \
            -ex "bt" \
            -ex "echo \n==== ALL THREADS ====\n" \
            -ex "thread apply all bt" \
            --args clang++ -std=c++17 -O2 -c /tmp/fixture.cpp -o /tmp/fixture.o 2>&1 | tee clang_bt.log | tail -150

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-backtraces-${{ github.sha }}
          path: |
            find_bt.log
            clang_bt.log
          retention-days: 30
