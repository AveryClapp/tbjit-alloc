name: Bench

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'bench/**'
      - 'test/integration/**'
      - 'CMakeLists.txt'
      - '.github/workflows/bench.yml'

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential \
            libmimalloc-dev libjemalloc-dev

      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Run benchmark suite
        run: |
          mkdir -p bench-out
          bash bench/run_bench.sh build | tee bench-out/results.txt

      - name: Run direct-call microbench (no LD_PRELOAD trampoline)
        run: |
          build/bench/bench_micro_jit_direct | tee bench-out/micro.txt

      - name: Allocator comparison (glibc vs mimalloc vs jemalloc vs tbjit)
        run: |
          bash bench/run_alloc_comparison.sh build | tee bench-out/comparison.txt

      - name: Capture per-workload TBJIT_DUMP (auto-strategy picker)
        run: |
          mkdir -p bench-out/dumps bench-out/json
          for p in monomorphic arena mixed pulse bimodal lifo producer_consumer hold; do
            bin=build/bench/bench_$p
            [ -x "$bin" ] || { echo "skip $p: missing"; continue; }
            LD_PRELOAD=$PWD/build/libtbjit.so TBJIT_DUMP=1 \
              TBJIT_DUMP_JSON=$PWD/bench-out/json/${p}.json \
              "$bin" \
              > bench-out/dumps/${p}.stdout \
              2> bench-out/dumps/${p}.dump
          done

      - name: Aggregate picker stats across workloads
        run: |
          python3 tools/analyze_dumps.py bench-out/json --format md \
            > bench-out/aggregate.md
          python3 tools/analyze_dumps.py bench-out/json --format text \
            > bench-out/aggregate.txt
          python3 tools/analyze_dumps.py bench-out/json --format tsv \
            > bench-out/aggregate.tsv

      - name: Render results into job summary
        run: |
          {
            echo "## Benchmark results"
            echo
            echo '```'
            cat bench-out/results.txt
            echo '```'
            echo
            echo "## Allocator comparison (steady-state ns/op)"
            echo
            echo '```'
            cat bench-out/comparison.txt
            echo '```'
            echo
            echo "## Direct-call microbench (no trampoline)"
            echo
            echo '```'
            cat bench-out/micro.txt
            echo '```'
            echo
            echo "## Auto-picker aggregate (cross-workload)"
            echo
            if [ -s bench-out/aggregate.md ]; then
              cat bench-out/aggregate.md
            else
              echo "_no aggregate produced (no JSON dumps found)_"
            fi
            echo
            echo "## Auto-picker decisions per workload"
            for f in bench-out/dumps/*.dump; do
              [ -s "$f" ] || continue
              name=$(basename "$f" .dump)
              echo
              echo "### $name"
              echo '```'
              cat "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bench artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.sha }}
          path: bench-out/
          retention-days: 30
